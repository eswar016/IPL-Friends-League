name: IPL Sync Ping

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        env:
          SYNC_ENDPOINT_URL: ${{ secrets.SYNC_ENDPOINT_URL }}
        run: |
          if [ -z "$SYNC_ENDPOINT_URL" ]; then
            echo "Missing SYNC_ENDPOINT_URL secret."
            exit 1
          fi
          status=$(curl --silent --show-error --location --output response.json --write-out "%{http_code}" "$SYNC_ENDPOINT_URL")
          echo "HTTP status: $status"
          cat response.json
          echo ""
          # 401 = wrong URL, missing key, or deployment protection — must fail loudly.
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "Sync request failed: unauthorized or forbidden (check secret and Vercel deployment access)."
            exit 1
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Sync request failed (server or network error)."
            exit 1
          fi
          if command -v jq >/dev/null 2>&1; then
            ok=$(jq -r '.ok // empty' response.json 2>/dev/null || true)
            if [ "$ok" = "false" ]; then
              echo "Warning: sync completed but reported ok=false (see error field in JSON above). Workflow will not fail."
            fi
          fi
